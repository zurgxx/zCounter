<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zCounter Mock — 20260828_2 Grok Bot usage</title>
  <style>
    :root {
      --bg: #f5f5f7; --surface: #fff; --text: #1d1d1f; --secondary: #6e6e73;
      --border: rgba(0, 0, 0, .06); --safe: #34c759; --warning: #ff9500;
      --critical: #ff3b30; --safe-bg: rgba(52, 199, 89, .12);
      --warning-bg: rgba(255, 149, 0, .12); --critical-bg: rgba(255, 59, 48, .12);
      --preview-bg: linear-gradient(160deg, #e8e8ed 0%, #d1d1d6 100%);
      --window-w: 364px; --accent: #007aff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body.preview {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px 64px;
      background: var(--preview-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .preview-label {
      position: absolute; top: 12px; left: 16px; color: var(--secondary);
      font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    }
    .window {
      width: var(--window-w); min-height: 760px; overflow: hidden; border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .06);
      background: var(--bg); color: var(--text);
    }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
    .header h1 { font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--safe); box-shadow: 0 0 0 3px var(--safe-bg); }
    .dot.warning { background: var(--warning); box-shadow: 0 0 0 3px var(--warning-bg); }
    .dot.critical { background: var(--critical); box-shadow: 0 0 0 3px var(--critical-bg); }

    .variant-bar { padding: 0 12px 10px; display: flex; flex-direction: column; gap: 6px; }
    .variant-bar p { color: var(--secondary); font-size: 10px; line-height: 1.45; padding: 0 4px; }
    .variant-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .variant-tabs button {
      border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px;
      background: var(--surface); color: var(--secondary); font-size: 10px;
      font-weight: 600; cursor: pointer; line-height: 1.3;
    }
    .variant-tabs button.active {
      border-color: rgba(0, 122, 255, .35); background: rgba(0, 122, 255, .08); color: var(--accent);
    }

    .cards { display: flex; flex-direction: column; gap: 8px; padding: 0 12px 10px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
    .provider { color: var(--secondary); font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
    .account { margin-top: 2px; font-size: 15px; font-weight: 600; }
    .plan { margin-top: 1px; color: var(--secondary); font-size: 12px; }
    .pill { border-radius: 6px; padding: 4px 8px; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .pill.safe { background: var(--safe-bg); color: #248a3d; }
    .pill.warning { background: var(--warning-bg); color: #b25000; }
    .pill.critical { background: var(--critical-bg); color: #d70015; }
    .metrics { display: flex; gap: 12px; }
    .metric { flex: 1; min-width: 0; }
    .metric-label, .reset { color: var(--secondary); font-size: 11px; }
    .value { margin-top: 4px; font-size: 22px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .safe { color: var(--safe); } .warning { color: var(--warning); } .critical { color: var(--critical); }
    .bar { height: 5px; margin-top: 6px; overflow: hidden; border-radius: 3px; background: #e5e5ea; }
    .fill { height: 100%; border-radius: 3px; background: currentColor; }
    .reset { margin-top: 8px; font-size: 10px; }
    .reset strong { display: block; margin-top: 1px; color: var(--text); font-size: 11px; font-weight: 500; }
    .error, .empty { padding: 0 16px 12px; color: var(--secondary); font-size: 11px; }
    .footer { border-top: 1px solid var(--border); background: rgba(255, 255, 255, .6); }
    .footer-meta {
      padding: 6px 16px 0; color: var(--secondary); font-size: 10px; line-height: 1.35;
      text-align: center; font-variant-numeric: tabular-nums;
    }
    .footer-meta .countdown { color: var(--text); font-weight: 600; }
    button.refresh { width: 100%; border: 0; padding: 9px; background: transparent; color: var(--accent); cursor: pointer; font: inherit; font-size: 13px; }
    button.refresh:hover { background: rgba(0, 0, 0, .04); }
    button.refresh:disabled { cursor: default; opacity: .5; }

    /* 現行 Cursor カード */
    .card-cursor .card-top { margin-bottom: 8px; }
    .cursor-metrics { display: flex; flex-direction: column; gap: 6px; }
    .cursor-metrics .hero-value { font-size: 24px; margin-top: 2px; }
    .cursor-metrics .hero .bar { margin-top: 4px; }
    .cursor-metrics .sub-row { display: flex; gap: 6px; }
    .cursor-metrics .sub-metric {
      flex: 1; min-width: 0; padding: 5px 7px; border-radius: 8px; background: #f5f5f7;
    }
    .cursor-metrics .sub-metric .metric-label { font-size: 10px; line-height: 1.2; }
    .cursor-metrics .sub-value { font-size: 15px; margin-top: 1px; }
    .cursor-metrics .bar.thin { height: 3px; margin-top: 3px; }
    .cursor-metrics .sub-foot { display: flex; gap: 8px; }
    .cursor-metrics .sub-foot-col { flex: 1; min-width: 0; }
    .cursor-metrics .sub-foot .reset { margin-top: 0; }
    .cursor-metrics .sub-foot .reset .pace-label { font-size: 9px; letter-spacing: -.01em; }

    /* Grok Bot 共通 */
    .grok-title { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
    .grok-title strong { font-size: 11px; font-weight: 650; }
    .grok-period { color: var(--secondary); font-size: 10px; }
    .grok-separate { color: var(--secondary); font-size: 9px; white-space: nowrap; }
    .grok-percent { color: var(--text); font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .grok-percent span { color: var(--secondary); font-size: 9px; font-weight: 500; }
    .grok-reset { color: var(--secondary); font-size: 9px; line-height: 1.3; }
    .grok-reset strong { color: var(--text); font-size: 10px; font-weight: 500; }
    .grok-bar { grid-column: 1 / -1; height: 3px; margin-top: -1px; }
    .grok-bar .fill { background: #8d8d93; }

    /* 案A: サブメトリクスの下に1行追加 */
    .grok-inline {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px;
      padding: 6px 7px; border-radius: 8px; background: #f5f5f7;
    }
    .grok-inline .grok-separate { grid-column: 1 / -1; }
    .grok-inline .grok-reset { grid-column: 1 / -1; }
    .grok-inline .grok-bar { margin-top: 1px; }

    /* 案B: 小さな独立ブロック */
    .grok-box {
      padding: 8px 9px; border: 1px solid var(--border); border-radius: 10px; background: #fbfbfd;
    }
    .grok-box-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .grok-box-head .grok-separate {
      padding: 2px 5px; border-radius: 4px; background: #f0f0f3; font-size: 9px;
    }
    .grok-box-main { display: flex; align-items: end; justify-content: space-between; gap: 8px; margin-top: 5px; }
    .grok-box .grok-percent { font-size: 16px; }
    .grok-box .grok-reset { text-align: right; }
    .grok-box .grok-bar { margin-top: 6px; }

    /* 案C: 通常 usage と footer の間に区切りストリップ */
    .grok-strip {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 2px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    .grok-strip-left { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
    .grok-strip-left .grok-separate { display: block; }
    .grok-strip-right { text-align: right; white-space: nowrap; }
    .grok-strip-right .grok-percent { font-size: 13px; }
    .grok-strip-right .grok-reset { margin-top: 1px; }
    .grok-strip .grok-bar { display: none; }

    .codex-reset-foot {
      display: flex; gap: 12px; margin-top: 8px; padding-top: 2px;
    }
    .codex-reset-foot .sub-foot-col { flex: 1; min-width: 0; }
    .codex-reset-foot .reset { margin-top: 0; }
  </style>
</head>
<body class="preview">
  <p class="preview-label">Mock 20260828_2 — Cursor / Grok Bot usage</p>
  <div class="window">
    <header class="header"><h1>zCounter</h1><span id="dot" class="dot" title="正常"></span></header>
    <div class="variant-bar">
      <div class="variant-tabs" role="tablist" aria-label="Grok Bot usage layout variants">
    <button type="button" class="active" data-variant="a" aria-selected="true">案A<br>Grokを下段へ</button>
        <button type="button" data-variant="b" aria-selected="false">案B<br>独立ブロック</button>
        <button type="button" data-variant="c" aria-selected="false">案C<br>区切りストリップ</button>
      </div>
    <p id="variant-note">Reset / Pace のフッターを先に置き、その下に Grok Bot の週次枠を小さく1行追加。Total の主役感は維持。</p>
    </div>
    <main id="cards" class="cards"><p class="empty">Loading...</p></main>
    <footer class="footer">
      <p id="footer-meta" class="footer-meta">—</p>
      <button type="button" class="refresh" id="refresh">Refresh</button>
    </footer>
  </div>
  <script>
    const VARIANT_NOTES = {
      a: "案A — Reset / Pace のフッターと Grok Bot の順序を入れ替え。Grok Bot を下段に置いて週次枠として見せる。",
      b: "案B — Grok Bot だけ小さな独立ブロック。通常 usage と別枠であることを最も明確に伝える。",
      c: "案C — 通常 usage と footer の間に細い区切り。情報量を抑えつつ、別の週次プールだと分かる。",
    };

    const MOCK_PAYLOAD = {
      accounts: [
        {
          provider: "Codex", account: "zurgxx", email: "zurgxx@example.com", plan: "Plus",
          level: "safe", status: "ok", status_label: "Safe", error: null,
          metrics: [
            { label: "5H", remaining_percent: 99, level: "safe", reset: "13:59" },
            { label: "WEEK", remaining_percent: 87, level: "safe", reset: "9/1(月) 21:59" },
          ],
          reset_credits: { available_count: 2, expires: "9/12(土) 13:03" },
        },
        {
          provider: "Cursor", account: "rock", email: "rock@example.com", plan: "Cursor Pro",
          level: "safe", status: "ok", status_label: "Safe", error: null,
          display_mode: "cursor-hero",
          cursor: {
            total: { label: "Total", remaining_percent: 53, level: "safe" },
            sub_metrics: [
              { label: "First-party models", remaining_percent: 39, level: "safe" },
              { label: "API", remaining_percent: 99, level: "safe" },
            ],
            grok_bot: {
              label: "Grok Bot", period: "Weekly", remaining_percent: 99,
              reset: "9/2(水)", reset_detail: "6 days left",
              separate_label: "Separate weekly pool",
            },
            footer: {
              reset: "9/28(月) 9:36", pace_total: "3.3%/d", pace_total_level: "safe",
              pace_first_party: "2.3%/d", pace_first_party_level: "warning", pace_level: "safe",
            },
          },
        },
        {
          provider: "Claude", account: "zurgxx", email: "zurgxx@example.com", plan: "Pro",
          level: "safe", status: "ok", status_label: "Safe", error: null,
          metrics: [
            { label: "5H", remaining_percent: 98, level: "safe", reset: "13:59" },
            { label: "WK", remaining_percent: 100, level: "safe", reset: "9/1(月) 21:59" },
          ],
        },
      ],
      critical_count: 0, warning_count: 0, updated_at: null,
    };

    const REFRESH_SECONDS = 300;
    let activeVariant = "a";
    const cards = document.getElementById("cards");
    const dot = document.getElementById("dot");
    const footerMeta = document.getElementById("footer-meta");
    const refreshButton = document.getElementById("refresh");
    const variantNote = document.getElementById("variant-note");
    const variantButtons = document.querySelectorAll(".variant-tabs button");
    let lastUpdatedAt = null;
    let countdownTimer = null;
    const JST = "Asia/Tokyo";
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    function jstParts(date) {
      return new Intl.DateTimeFormat("en-US", {
        timeZone: JST, month: "numeric", day: "numeric", hour: "numeric",
        minute: "2-digit", second: "2-digit", hourCycle: "h23",
      }).formatToParts(date);
    }
    function jstWeekday(date) {
      return new Intl.DateTimeFormat("ja-JP", { timeZone: JST, weekday: "narrow" }).format(date);
    }
    function formatShortDate(date) {
      const parts = jstParts(date);
      const get = type => parts.find(part => part.type === type)?.value ?? "";
      return get("month") + "/" + get("day") + "(" + jstWeekday(date) + ")";
    }
    function formatShortDateTime(date, withSeconds = false) {
      const parts = jstParts(date);
      const get = type => parts.find(part => part.type === type)?.value ?? "";
      const hour = String(Number(get("hour")));
      const time = withSeconds ? hour + ":" + get("minute") + ":" + get("second") : hour + ":" + get("minute");
      return formatShortDate(date) + " " + time;
    }
    function formatUpdatedAt(updatedAt) {
      return formatShortDateTime(new Date(updatedAt), true);
    }
    function remainingSeconds(now = Date.now()) {
      if (!lastUpdatedAt) return REFRESH_SECONDS;
      const nextAt = lastUpdatedAt.getTime() + REFRESH_SECONDS * 1000;
      return Math.max(0, Math.ceil((nextAt - now) / 1000));
    }
    function updateFooterMeta() {
      if (!lastUpdatedAt) { footerMeta.textContent = "—"; return; }
      footerMeta.innerHTML = "updated " + escapeHtml(formatUpdatedAt(lastUpdatedAt)) +
        " · <span class=\"countdown\">" + remainingSeconds() + "s</span>";
    }
    function startCountdown() {
      if (countdownTimer) window.clearInterval(countdownTimer);
      updateFooterMeta();
      countdownTimer = window.setInterval(updateFooterMeta, 1000);
    }
    function resetCreditsHtml(account) {
      const rc = account.reset_credits;
      if (!rc || rc.available_count <= 0) return "";
      return "<div class=\"codex-reset-foot\">" +
        "<div class=\"sub-foot-col\"><p class=\"reset\">Reset Credits<strong>" + rc.available_count + " available</strong></p></div>" +
        "<div class=\"sub-foot-col\"><p class=\"reset\">Expires<strong>" + escapeHtml(rc.expires || "—") + "</strong></p></div>" +
        "</div>";
    }
    function grokCommon(grok) {
      return "<div class=\"grok-title\"><strong>" + escapeHtml(grok.label) + "</strong>" +
        "<span class=\"grok-period\">" + escapeHtml(grok.period) + "</span></div>" +
        "<span class=\"grok-percent\">" + grok.remaining_percent + "% <span>remaining</span></span>";
    }
    function grokBar(grok) {
      return "<div class=\"bar grok-bar\"><div class=\"fill\" style=\"width:" + grok.remaining_percent + "%\"></div></div>";
    }
    function grokHtml(cursor, variant) {
      const grok = cursor.grok_bot;
      if (!grok) return "";
      const title = grokCommon(grok);
      const reset = "Resets " + escapeHtml(grok.reset) + " · " + escapeHtml(grok.reset_detail);
      const separate = escapeHtml(grok.separate_label);
      if (variant === "a") {
        return "<div class=\"grok-inline\">" + title +
          "<span class=\"grok-separate\">" + separate + "</span>" +
          "<div class=\"grok-reset\">" + reset + "</div>" + grokBar(grok) + "</div>";
      }
      if (variant === "b") {
        return "<div class=\"grok-box\">" +
          "<div class=\"grok-box-head\">" + title + "<span class=\"grok-separate\">" + separate + "</span></div>" +
          "<div class=\"grok-box-main\"><span class=\"grok-percent\">" + grok.remaining_percent +
          "% <span>remaining</span></span><span class=\"grok-reset\">" + reset + "</span></div>" +
          grokBar(grok) + "</div>";
      }
      return "<div class=\"grok-strip\">" +
        "<div class=\"grok-strip-left\">" + title + "<span class=\"grok-separate\">" + separate + "</span></div>" +
        "<div class=\"grok-strip-right\"><div class=\"grok-percent\">" + grok.remaining_percent +
        "% <span>remaining</span></div><div class=\"grok-reset\">" + reset + "</div></div></div>";
    }
    function metricHtml(metric) {
      const paceBlock = metric.pace && metric.pace !== "-"
        ? "<p class=\"reset\">Pace<strong>" + escapeHtml(metric.pace) + "</strong></p>"
        : metric.reset === "-" ? "" : "<p class=\"reset\">Reset<strong>" + escapeHtml(metric.reset) + "</strong></p>";
      return "<div class=\"metric\"><div class=\"metric-label\">" + escapeHtml(metric.label) + "</div>" +
        "<div class=\"value " + metric.level + "\">" + metric.remaining_percent + "%</div>" +
        "<div class=\"bar\"><div class=\"fill " + metric.level + "\" style=\"width:" + metric.remaining_percent + "%\"></div></div>" +
        paceBlock + "</div>";
    }
    function heroMetricHtml(metric) {
      return "<div class=\"metric\"><div class=\"metric-label\">" + escapeHtml(metric.label) + "</div>" +
        "<div class=\"value hero-value " + metric.level + "\">" + metric.remaining_percent + "%</div>" +
        "<div class=\"bar\"><div class=\"fill " + metric.level + "\" style=\"width:" + metric.remaining_percent + "%\"></div></div></div>";
    }
    function subMetricHtml(metric) {
      return "<div class=\"sub-metric\"><div class=\"metric\"><div class=\"metric-label\">" +
        escapeHtml(metric.label) + "</div><div class=\"value sub-value " + metric.level + "\">" +
        metric.remaining_percent + "%</div><div class=\"bar thin\"><div class=\"fill " + metric.level +
        "\" style=\"width:" + metric.remaining_percent + "%\"></div></div></div></div>";
    }
    function paceFootCol(label, value, level) {
      if (!value || value === "-") return "<div class=\"sub-foot-col\"></div>";
      return "<div class=\"sub-foot-col\"><p class=\"reset\"><span class=\"pace-label\">" +
        escapeHtml(label) + "</span><strong class=\"" + (level || "safe") + "\">" +
        escapeHtml(value) + "</strong></p></div>";
    }
    function cursorMetricsHtml(cursor) {
      const footer = cursor.footer;
      const footerHtml = "<div class=\"sub-foot\"><div class=\"sub-foot-col\"><p class=\"reset\">Reset<strong>" +
        escapeHtml(footer.reset) + "</strong></p></div>" +
        paceFootCol("Pace(Total)", footer.pace_total, footer.pace_total_level) +
        paceFootCol("Pace(First-party models)", footer.pace_first_party, footer.pace_first_party_level) +
        "</div>";
      const grokHtmlBlock = grokHtml(cursor, activeVariant);
      const extraHtml = activeVariant === "a"
        ? footerHtml + grokHtmlBlock
        : grokHtmlBlock + footerHtml;
      return "<div class=\"cursor-metrics\">" +
        "<div class=\"hero\">" + heroMetricHtml(cursor.total) + "</div>" +
        "<div class=\"sub-row\">" + cursor.sub_metrics.map(subMetricHtml).join("") + "</div>" +
        extraHtml + "</div>";
    }
    function cardHtml(account) {
      const error = account.error && account.status !== "ok"
        ? "<p class=\"error\">" + escapeHtml(account.error) + "</p>" : "";
      const metrics = account.display_mode === "cursor-hero" && account.cursor
        ? cursorMetricsHtml(account.cursor)
        : "<div class=\"metrics\">" + account.metrics.map(metricHtml).join("") + "</div>";
      return "<article class=\"card" + (account.display_mode === "cursor-hero" ? " card-cursor" : "") +
        "\"><div class=\"card-top\"><div><div class=\"provider\">" + escapeHtml(account.provider) +
        "</div><div class=\"account\">" + escapeHtml(account.account) + "</div><div class=\"plan\">" +
        escapeHtml(account.plan) + "</div></div><span class=\"pill " + account.level + "\">" +
        escapeHtml(account.status_label) + "</span></div>" + metrics +
        (account.provider === "Codex" ? resetCreditsHtml(account) : "") + error + "</article>";
    }
    function render(payload) {
      if (payload.busy) return;
      cards.innerHTML = payload.accounts.length
        ? payload.accounts.map(cardHtml).join("") : "<p class=\"empty\">No accounts</p>";
      const level = payload.critical_count ? "critical" : payload.warning_count ? "warning" : "safe";
      dot.className = "dot " + level;
      dot.title = payload.critical_count ? payload.critical_count + "件 critical"
        : payload.warning_count ? payload.warning_count + "件 warning" : "正常";
      if (payload.updated_at) {
        lastUpdatedAt = new Date(payload.updated_at); startCountdown();
      } else {
        lastUpdatedAt = null;
        if (countdownTimer) window.clearInterval(countdownTimer);
        footerMeta.textContent = "—";
      }
    }
    function setVariant(variant) {
      activeVariant = variant;
      variantButtons.forEach(button => {
        const selected = button.dataset.variant === variant;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-selected", selected ? "true" : "false");
      });
      variantNote.textContent = VARIANT_NOTES[variant];
      render({ ...MOCK_PAYLOAD, updated_at: lastUpdatedAt ? lastUpdatedAt.toISOString() : new Date().toISOString() });
    }
    variantButtons.forEach(button => button.addEventListener("click", () => setVariant(button.dataset.variant)));
    function refresh() {
      refreshButton.disabled = true; refreshButton.textContent = "...";
      window.setTimeout(() => {
        render({ ...MOCK_PAYLOAD, updated_at: new Date().toISOString() });
        refreshButton.disabled = false; refreshButton.textContent = "Refresh";
      }, 150);
    }
    refreshButton.addEventListener("click", refresh);
    render({ ...MOCK_PAYLOAD, updated_at: new Date().toISOString() });
  </script>
</body>
</html>
