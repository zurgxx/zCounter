<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usage History · zCounter</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --surface: #fff;
      --text: #1d1d1f;
      --secondary: #6e6e73;
      --border: rgba(0, 0, 0, .08);
      --blue: #1677ff;
      --grid: #e7e7eb;
      --gap: rgba(110, 110, 115, .12);
      --reset: #d26b16;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 640px; min-height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page { max-width: 1240px; margin: 0 auto; padding: 20px 24px 36px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 21px; letter-spacing: -.02em; }
    #status { color: var(--secondary); font-size: 12px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 18px; }
    .control-group { display: flex; gap: 5px; padding: 4px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface); }
    button, select { color: var(--text); font: inherit; }
    .choice {
      border: 0; border-radius: 7px; padding: 7px 12px; background: transparent;
      color: var(--secondary); cursor: pointer; font-size: 13px;
    }
    .choice:hover { background: #f2f2f5; }
    .choice.active { background: #e8f1ff; color: #075fc9; font-weight: 650; }
    .select-wrap { display: flex; align-items: center; gap: 8px; color: var(--secondary); font-size: 12px; }
    #account-select {
      min-width: 190px; max-width: 300px; border: 1px solid var(--border); border-radius: 9px;
      padding: 8px 30px 8px 10px; background: var(--surface); font-size: 13px;
    }
    #account-wrap[hidden] { display: none; }
    #charts { display: grid; gap: 14px; }
    .chart-card { min-width: 0; padding: 15px 16px 12px; border: 1px solid var(--border); border-radius: 15px; background: var(--surface); }
    .chart-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 5px; }
    .chart-heading h2 { margin: 0; font-size: 15px; font-weight: 650; }
    .reset-note { color: var(--reset); font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; }
    .chart-subtitle { min-height: 16px; color: var(--secondary); font-size: 11px; }
    .chart-wrap { position: relative; width: 100%; margin-top: 3px; }
    svg.chart { display: block; width: 100%; height: auto; overflow: visible; touch-action: none; }
    .grid-line { stroke: var(--grid); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .axis-label { fill: var(--secondary); font-size: 11px; font-variant-numeric: tabular-nums; }
    .series-line { fill: none; stroke: var(--blue); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .series-dot { fill: var(--blue); stroke: white; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .gap-band { fill: var(--gap); }
    .gap-label { fill: #626269; font-size: 10px; }
    .reset-line { stroke: var(--reset); stroke-width: 1.5; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
    .reset-label { fill: var(--reset); font-size: 10px; font-weight: 650; }
    .hover-line { stroke: #8c8c92; stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
    .hover-dot { fill: var(--blue); stroke: white; stroke-width: 2; vector-effect: non-scaling-stroke; }
    .chart-hit-area { fill: transparent; pointer-events: all; }
    .tooltip {
      position: absolute; z-index: 2; min-width: 140px; pointer-events: none;
      padding: 8px 10px; border-radius: 8px; background: rgba(29, 29, 31, .94);
      color: white; font-size: 11px; line-height: 1.5; box-shadow: 0 4px 14px rgba(0,0,0,.16);
      font-variant-numeric: tabular-nums;
    }
    .tooltip[hidden] { display: none; }
    .empty { padding: 32px 20px; border: 1px dashed #c8c8ce; border-radius: 14px; color: var(--secondary); text-align: center; }
    .footer-note { margin: 14px 2px 0; color: var(--secondary); font-size: 11px; }
    @media (max-width: 760px) {
      .page { padding: 15px 12px 28px; }
      .toolbar { gap: 8px; }
      .control-group { gap: 1px; }
      .choice { padding: 7px 9px; }
      .chart-card { padding: 12px 10px 8px; }
      .chart-heading { align-items: flex-start; flex-direction: column; gap: 3px; }
      .reset-note { text-align: left; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Usage History</h1>
      <span id="status" role="status">Loading…</span>
    </header>

    <nav class="toolbar" aria-label="History filters">
      <div id="provider-controls" class="control-group" role="group" aria-label="Provider">
        <button class="choice active" type="button" data-provider="codex">Codex</button>
        <button class="choice" type="button" data-provider="claude">Claude</button>
        <button class="choice" type="button" data-provider="cursor">Cursor</button>
      </div>
      <label id="account-wrap" class="select-wrap" hidden>
        <span>Account</span>
        <select id="account-select"></select>
      </label>
      <div id="period-controls" class="control-group" role="group" aria-label="Period">
        <button class="choice" type="button" data-period="1h">1H</button>
        <button class="choice active" type="button" data-period="5h">5H</button>
        <button class="choice" type="button" data-period="24h">24H</button>
        <button class="choice" type="button" data-period="7d">7D</button>
        <button class="choice" type="button" data-period="30d">30D</button>
        <button class="choice" type="button" data-period="all">ALL</button>
      </div>
    </nav>

    <section id="charts" aria-live="polite"></section>
    <p class="footer-note">線は観測点を結んでいます。6分を超える空白は「データなし」として切断しています。</p>
  </main>

  <script>
    const PROVIDER_LABELS = { codex: "Codex", claude: "Claude", cursor: "Cursor" };
    const PERIOD_LABELS = { "1h": "1H", "5h": "5H", "24h": "24H", "7d": "7D", "30d": "30D", all: "ALL" };
    const SVG_NS = "http://www.w3.org/2000/svg";
    const SVG = { width: 1000, height: 280, left: 62, right: 980, top: 18, bottom: 238 };
    const statusNode = document.getElementById("status");
    const chartsNode = document.getElementById("charts");
    const accountWrap = document.getElementById("account-wrap");
    const accountSelect = document.getElementById("account-select");
    let provider = "codex";
    let period = "5h";
    let accountId = null;
    let requestSerial = 0;

    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
    const asDate = value => new Date(value);
    function dateLabel(value, includeSeconds = false) {
      const options = includeSeconds
        ? { year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23", timeZone: "Asia/Tokyo" }
        : { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: "Asia/Tokyo" };
      return new Intl.DateTimeFormat("ja-JP", options).format(asDate(value));
    }
    function percentLabel(value) {
      return `${Number(value).toLocaleString("ja-JP", { maximumFractionDigits: 2 })}%`;
    }
    function svgNode(name, attributes = {}, text = null) {
      const node = document.createElementNS(SVG_NS, name);
      for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
      if (text !== null) node.textContent = text;
      return node;
    }
    function xFor(timestamp, startMs, endMs) {
      const span = Math.max(1, endMs - startMs);
      return SVG.left + ((asDate(timestamp).getTime() - startMs) / span) * (SVG.right - SVG.left);
    }
    function yFor(remaining) {
      return SVG.top + ((100 - Number(remaining)) / 100) * (SVG.bottom - SVG.top);
    }
    function formatGap(gap) {
      const minutes = Math.round(Number(gap.duration_seconds) / 60);
      return `データなし · ${dateLabel(gap.from)} – ${dateLabel(gap.to)} (${minutes}分)`;
    }
    function makeSvg(chart, payload) {
      const svg = svgNode("svg", {
        class: "chart", viewBox: `0 0 ${SVG.width} ${SVG.height}`, role: "img",
        "aria-label": `${chart.quota_label} remaining percentage history`,
      });
      const startMs = asDate(payload.range_start).getTime();
      const endMs = asDate(payload.range_end).getTime();
      const plotWidth = SVG.right - SVG.left;

      for (const tick of [0, 25, 50, 75, 100]) {
        const y = yFor(tick);
        svg.append(svgNode("line", { class: "grid-line", x1: SVG.left, x2: SVG.right, y1: y, y2: y }));
        svg.append(svgNode("text", { class: "axis-label", x: SVG.left - 10, y: y + 4, "text-anchor": "end" }, `${tick}%`));
      }
      svg.append(svgNode("line", { class: "grid-line", x1: SVG.left, x2: SVG.right, y1: SVG.bottom, y2: SVG.bottom }));

      for (const gap of chart.gaps) {
        const left = Math.max(SVG.left, xFor(gap.from, startMs, endMs));
        const right = Math.min(SVG.right, xFor(gap.to, startMs, endMs));
        const band = svgNode("rect", { class: "gap-band", x: left, y: SVG.top, width: Math.max(1, right - left), height: SVG.bottom - SVG.top });
        band.append(svgNode("title", {}, formatGap(gap)));
        svg.append(band);
        if (right - left > 72) {
          svg.append(svgNode("text", { class: "gap-label", x: (left + right) / 2, y: SVG.top + 15, "text-anchor": "middle" }, "データなし"));
        }
      }

      for (const marker of chart.reset_markers) {
        const x = xFor(marker, startMs, endMs);
        const line = svgNode("line", { class: "reset-line", x1: x, x2: x, y1: SVG.top, y2: SVG.bottom });
        line.append(svgNode("title", {}, `Reset予定 · ${dateLabel(marker, true)}`));
        svg.append(line);
        svg.append(svgNode("text", { class: "reset-label", x: Math.min(x + 5, SVG.right - 70), y: SVG.top + 12 }, "Reset予定"));
      }

      const plotted = [];
      for (const segment of chart.segments) {
        if (!segment.length) continue;
        const path = segment.map((point, index) => {
          const x = xFor(point.timestamp, startMs, endMs);
          const y = yFor(point.remaining_percent);
          plotted.push({ ...point, x, y });
          return `${index === 0 ? "M" : "L"}${x.toFixed(2)},${y.toFixed(2)}`;
        }).join(" ");
        if (segment.length > 1) svg.append(svgNode("path", { class: "series-line", d: path }));
        else {
          const point = segment[0];
          svg.append(svgNode("circle", { class: "series-dot", cx: xFor(point.timestamp, startMs, endMs), cy: yFor(point.remaining_percent), r: 3.2 }));
        }
      }

      const tickCount = 5;
      for (let index = 0; index < tickCount; index += 1) {
        const ratio = index / (tickCount - 1);
        const timestamp = new Date(startMs + (endMs - startMs) * ratio).toISOString();
        const x = SVG.left + plotWidth * ratio;
        svg.append(svgNode("line", { class: "grid-line", x1: x, x2: x, y1: SVG.bottom, y2: SVG.bottom + 4 }));
        svg.append(svgNode("text", { class: "axis-label", x, y: SVG.bottom + 23, "text-anchor": index === 0 ? "start" : index === tickCount - 1 ? "end" : "middle" }, dateLabel(timestamp)));
      }

      const hoverLine = svgNode("line", { class: "hover-line", x1: 0, x2: 0, y1: SVG.top, y2: SVG.bottom, visibility: "hidden" });
      const hoverDot = svgNode("circle", { class: "hover-dot", cx: 0, cy: 0, r: 5, visibility: "hidden" });
      svg.append(hoverLine, hoverDot);
      const hitArea = svgNode("rect", { class: "chart-hit-area", x: SVG.left, y: SVG.top, width: plotWidth, height: SVG.bottom - SVG.top });
      svg.append(hitArea);
      return { svg, plotted, hoverLine, hoverDot, startMs, endMs };
    }
    function chartCard(chart, payload) {
      const card = document.createElement("article");
      card.className = "chart-card";
      const heading = document.createElement("div");
      heading.className = "chart-heading";
      const title = document.createElement("h2");
      title.textContent = chart.quota_label;
      const resetNote = document.createElement("div");
      resetNote.className = "reset-note";
      resetNote.textContent = chart.next_reset ? `Reset予定: ${dateLabel(chart.next_reset, true)}` : "";
      heading.append(title, resetNote);
      const subtitle = document.createElement("p");
      subtitle.className = "chart-subtitle";
      subtitle.textContent = `${PROVIDER_LABELS[payload.provider]} · 残量`;
      const wrap = document.createElement("div");
      wrap.className = "chart-wrap";
      const tooltip = document.createElement("div");
      tooltip.className = "tooltip";
      tooltip.hidden = true;
      const graph = makeSvg(chart, payload);
      wrap.append(graph.svg, tooltip);

      graph.svg.addEventListener("pointermove", event => {
        if (!graph.plotted.length) return;
        const rect = graph.svg.getBoundingClientRect();
        const pointerX = ((event.clientX - rect.left) / rect.width) * SVG.width;
        const ratio = Math.max(0, Math.min(1, (pointerX - SVG.left) / (SVG.right - SVG.left)));
        const hoveredAt = graph.startMs + ratio * (graph.endMs - graph.startMs);
        const gap = chart.gaps.find(item => hoveredAt >= asDate(item.from).getTime() && hoveredAt <= asDate(item.to).getTime());
        graph.hoverLine.setAttribute("x1", pointerX);
        graph.hoverLine.setAttribute("x2", pointerX);
        graph.hoverLine.setAttribute("visibility", "visible");
        if (gap) {
          graph.hoverDot.setAttribute("visibility", "hidden");
          tooltip.textContent = formatGap(gap);
        } else {
          const nearest = graph.plotted.reduce((best, point) => Math.abs(point.x - pointerX) < Math.abs(best.x - pointerX) ? point : best);
          graph.hoverDot.setAttribute("cx", nearest.x);
          graph.hoverDot.setAttribute("cy", nearest.y);
          graph.hoverDot.setAttribute("visibility", "visible");
          tooltip.textContent = `${dateLabel(nearest.timestamp, true)} · ${percentLabel(nearest.remaining_percent)}`;
        }
        const wrapRect = wrap.getBoundingClientRect();
        tooltip.hidden = false;
        tooltip.style.left = `${Math.max(4, Math.min(event.clientX - wrapRect.left + 12, wrapRect.width - 200))}px`;
        tooltip.style.top = `${Math.max(2, event.clientY - wrapRect.top - 42)}px`;
      });
      graph.svg.addEventListener("pointerleave", () => {
        tooltip.hidden = true;
        graph.hoverLine.setAttribute("visibility", "hidden");
        graph.hoverDot.setAttribute("visibility", "hidden");
      });

      card.append(heading, subtitle);
      if (!chart.segments.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "この期間の履歴はありません";
        card.append(empty);
      } else {
        card.append(wrap);
      }
      return card;
    }
    function render(payload) {
      const accounts = payload.accounts || [];
      accountWrap.hidden = accounts.length <= 1;
      accountSelect.replaceChildren(...accounts.map(account => {
        const option = document.createElement("option");
        option.value = account.id;
        option.textContent = account.label;
        option.selected = account.id === payload.selected_account_id;
        return option;
      }));
      accountId = payload.selected_account_id;
      for (const button of document.querySelectorAll("[data-provider]")) {
        button.classList.toggle("active", button.dataset.provider === payload.provider);
      }
      for (const button of document.querySelectorAll("[data-period]")) {
        button.classList.toggle("active", button.dataset.period === payload.period);
      }

      chartsNode.replaceChildren();
      const charts = payload.charts || [];
      if (!charts.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = `${PROVIDER_LABELS[payload.provider]}の履歴はありません`;
        chartsNode.append(empty);
      } else {
        for (const chart of charts) chartsNode.append(chartCard(chart, payload));
      }
      const accountSuffix = accounts.length > 1 && accountId ? ` · ${accounts.find(item => item.id === accountId)?.label || ""}` : "";
      statusNode.textContent = `${PROVIDER_LABELS[payload.provider]} · ${PERIOD_LABELS[payload.period]}${accountSuffix}`;
    }
    async function loadHistory() {
      const request = ++requestSerial;
      statusNode.textContent = "Loading…";
      try {
        const payload = await window.pywebview.api.get_history(provider, accountId, period);
        if (request !== requestSerial) return;
        provider = payload.provider;
        period = payload.period;
        render(payload);
      } catch (error) {
        if (request !== requestSerial) return;
        statusNode.textContent = "履歴を読み込めませんでした";
        chartsNode.innerHTML = '<p class="empty">usage-history.jsonl を読み込めませんでした</p>';
        console.error("failed to load usage history", error);
      }
    }

    document.getElementById("provider-controls").addEventListener("click", event => {
      const button = event.target.closest("[data-provider]");
      if (!button || button.dataset.provider === provider) return;
      provider = button.dataset.provider;
      accountId = null;
      loadHistory();
    });
    document.getElementById("period-controls").addEventListener("click", event => {
      const button = event.target.closest("[data-period]");
      if (!button || button.dataset.period === period) return;
      period = button.dataset.period;
      loadHistory();
    });
    accountSelect.addEventListener("change", () => {
      accountId = accountSelect.value || null;
      loadHistory();
    });
    window.addEventListener("usagehistoryrefresh", loadHistory);
    window.addEventListener("pywebviewready", () => {
      loadHistory();
      window.setInterval(loadHistory, 120_000);
    });
  </script>
</body>
</html>
